# DEVELOPMENT-ONLY POSTGRESQL DOCKER COMPOSE SETUP
# This setup is strictly for local development and testing.
# DO NOT deploy or use in production environments.

version: '3.8'

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: aj_studio_dev_db
    environment:
      POSTGRES_DB: aj_studio_dev
      POSTGRES_USER: aj_dev
      POSTGRES_PASSWORD: aj_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aj_dev -d aj_studio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
    driver: local
